version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  tqs:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - ../.env.dev
    environment:
      TQS_MONGO_URL: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
