apiVersion: batch/v1
kind: CronJob
metadata:
  name: tls-stale-reaper
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reaper
              image: tls-service:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.reaper_job"]
              env:
                - name: TLS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tls-secrets
                      key: database-url
                - name: TLS_REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: tls-secrets
                      key: redis-url
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
